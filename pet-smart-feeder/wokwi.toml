[wokwi]
version = 1
elf      = "build/esp32.esp32.esp32doit-devkit-v1/pet-smart-feeder.ino.elf"
firmware = "build/esp32.esp32.esp32doit-devkit-v1/pet-smart-feeder.ino.bin"

[[wifi]]
ssid     = "Wokwi-GUEST"
password = ""
internet = true
channel  = 6

# Encaminha o WebServer do ESP32 para o navegador local
[[net.forward]]
from = "localhost:8280"
to   = "target:80"
